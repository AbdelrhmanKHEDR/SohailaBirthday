<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Album ❤️</title>
  <style>
    :root{
      --pink:#ff4f87; --rose:#ff2f73; --gold:#ffd166; --ink:#3d2330;
      --shadow:0 18px 45px rgba(139,45,80,.18);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;min-height:100vh;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--ink);
      background:
        radial-gradient(circle at 20% 10%,#ffe6ef 0,transparent 30%),
        radial-gradient(circle at 80% 20%,#fff0cf 0,transparent 25%),
        linear-gradient(135deg,#fff9f6,#ffeaf1);
      background-attachment:fixed;
    }
    button{font:inherit}
    .hidden{display:none!important}

    .wrap{max-width:1040px;margin:0 auto;padding:28px 18px 80px}

    .head{
      background:rgba(255,255,255,.82);backdrop-filter:blur(14px);
      border:1px solid rgba(255,255,255,.9);box-shadow:var(--shadow);
      border-radius:30px;padding:34px 24px;text-align:center;
    }
    .eyebrow{
      display:inline-block;padding:8px 14px;border-radius:999px;background:#fff0f5;
      color:#b6295a;font-weight:800;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;
    }
    h1{font-size:clamp(2rem,6vw,3.6rem);line-height:1;margin:18px 0 12px}
    .head p{max-width:560px;margin:10px auto;line-height:1.7;font-size:1.05rem}
    .tools{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}

    .btn{
      border:none;border-radius:999px;padding:14px 24px;font-weight:800;cursor:pointer;
      transition:.2s ease;box-shadow:0 10px 22px rgba(255,79,135,.16);
      text-decoration:none;display:inline-block;
    }
    .btn-primary{color:#fff;background:linear-gradient(135deg,var(--pink),var(--rose))}
    .btn-soft{color:#9d3157;background:#ffe9f1}
    .btn:hover{transform:translateY(-2px) scale(1.02)}
    .btn:focus-visible{outline:3px solid rgba(255,79,135,.4);outline-offset:2px}

    /* ---------- clothesline wall ---------- */
    .line{
      display:grid;grid-template-columns:repeat(3,1fr);
      margin-top:44px;
    }
    .clip{
      position:relative;padding:34px 14px 26px;
    }
    /* the string: continuous because items touch */
    .clip::before{
      content:"";position:absolute;left:0;right:0;top:14px;height:3px;
      background:#b98a98;border-radius:3px;
    }
    .pin{
      position:absolute;top:6px;left:50%;transform:translateX(-50%);
      width:14px;height:30px;border-radius:5px;background:linear-gradient(#e8b86d,#c98f3a);
      box-shadow:0 3px 6px rgba(0,0,0,.2);z-index:2;
    }
    .pol{
      display:block;width:100%;border:none;background:#fff;padding:10px 10px 14px;border-radius:5px;
      box-shadow:0 14px 30px rgba(87,37,58,.2);cursor:pointer;text-align:center;
      transform-origin:50% 0;transform:rotate(var(--r,0deg));
      transition:box-shadow .3s ease;
    }
    .clip:nth-child(3n+1) .pol{--r:-2.2deg}
    .clip:nth-child(3n+2) .pol{--r:1.6deg}
    .clip:nth-child(3n)   .pol{--r:-1deg}
    .pol:hover,.pol:focus-visible{animation:swing 1.2s ease-in-out;box-shadow:0 20px 40px rgba(87,37,58,.28);outline:none}
    @keyframes swing{
      0%{transform:rotate(var(--r,0deg))}
      25%{transform:rotate(calc(var(--r,0deg) + 4deg))}
      55%{transform:rotate(calc(var(--r,0deg) - 3deg))}
      80%{transform:rotate(calc(var(--r,0deg) + 1.2deg))}
      100%{transform:rotate(var(--r,0deg))}
    }
    .shot{aspect-ratio:1/1;overflow:hidden;background:linear-gradient(135deg,#ffcadd,#ff91b4);position:relative}
    .shot img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1) brightness(.4) blur(10px)}
    .clip.in .shot img{animation:develop 2.4s ease-out forwards}
    @keyframes develop{
      0%{filter:grayscale(1) brightness(.35) blur(12px)}
      60%{filter:grayscale(.7) sepia(.6) brightness(.85) blur(4px)}
      100%{filter:none}
    }
    .ph{
      position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:12px;
      color:#fff;font-weight:800;line-height:1.5;font-size:.9rem;
    }
    .cap{
      font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive;
      color:#7f3650;margin-top:10px;font-size:.95rem;line-height:1.3;
    }

    /* ---------- lightbox ---------- */
    .lb{
      position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;
      background:rgba(61,35,48,.72);backdrop-filter:blur(6px);
    }
    .lb-card{
      position:relative;width:min(560px,100%);max-height:94vh;overflow:auto;
      background:#fffafc;border-radius:28px;padding:26px 20px 22px;text-align:center;box-shadow:var(--shadow);
    }
    .lb-photo{
      width:min(380px,100%);margin:0 auto 14px;background:#fff;padding:12px 12px 16px;border-radius:6px;
      box-shadow:0 18px 40px rgba(87,37,58,.22);transform:rotate(-1.5deg);
    }
    .lb-photo .shot img{filter:none}
    .lb-card .cap{font-size:1.1rem}
    .lb-story{max-width:440px;margin:12px auto 0;line-height:1.7}
    .lb-nav{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:16px}
    .lb-count{font-weight:800;color:#9d3157;min-width:64px}
    .lb-close{
      position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:none;
      background:#ffe9f1;color:#9d3157;font-weight:800;cursor:pointer;
    }
    .toast{
      position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;
      background:#fff;border:1px solid #f6c8d8;color:#7f3650;font-weight:800;
      padding:12px 18px;border-radius:99px;box-shadow:var(--shadow);
    }

    .foot{text-align:center;margin-top:30px;color:#7d5967}

    @media(max-width:820px){.line{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:520px){
      .line{grid-template-columns:1fr}
      .btn{width:100%;text-align:center}
    }
    @media(prefers-reduced-motion:reduce){
      .shot img{filter:none!important;animation:none!important}
      .pol:hover,.pol:focus-visible{animation:none}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="head">
      <span class="eyebrow">Our Album 📸</span>
      <h1>The best of us</h1>
      <p>Every photo here is hanging by a tiny clip and a lot of love . Tap to see.</p>
      <div class="tools">
        <button class="btn btn-primary" id="jarBtn">Pull a memory from the jar 🫙</button>
        <a class="btn btn-soft" id="backLink" href="birthday_surprise_website.html#mapSection">Back to the map 🗺️</a>
      </div>
    </header>

    <main class="line" id="line"></main>

    <div class="foot">That was only a few of them. We still have the whole future to fill. ❤️</div>
  </div>

  <div class="lb hidden" id="lb" role="dialog" aria-modal="true" aria-label="Memory">
    <div class="lb-card">
      <button class="lb-close" id="lbClose" aria-label="Close">✕</button>
      <figure class="lb-photo" style="margin-bottom:14px">
        <div class="shot">
          <img id="lbImg" alt="" style="display:none">
          <div class="ph" id="lbPh"></div>
        </div>
        <div class="cap" id="lbCap"></div>
      </figure>
      <div class="cap" id="lbDate" style="font-size:.9rem"></div>
      <p class="lb-story" id="lbStory"></p>
      <div class="lb-nav">
        <button class="btn btn-soft" id="lbPrev" aria-label="Previous memory">‹</button>
        <span class="lb-count" id="lbCount"></span>
        <button class="btn btn-soft" id="lbNext" aria-label="Next memory">›</button>
      </div>
    </div>
  </div>

  <script>
    // =====================================================
    // EDIT YOUR MEMORIES HERE  ✏️
    // img  : file name inside /images, no extension needed (.jpg .jpeg .png .webp all work)
    // To add a memory, copy one line and change it. The wall grows by itself.
    // =====================================================
    const MAIN_PAGE = "birthday_surprise_website.html#mapSection";

    const MEMORIES = [
      { img:"fav4",  caption:"Our favorite kind of ordinary", date:"",  },
      { img:"fav1",  caption:" Food comes first",           date:"",  },
      { img:"fav2",  caption:"One step closer to forever",               },
      { img:"fav5",  caption:"The day I knew",                date:"",  },
      { img:"fav6",  caption:"Not a planned photo",           date:"",  },
      { img:"fav7",  caption:"Matching without trying",       date:"",  },
      { img:"fav12",  caption:"Somewhere new, with you",       date:"",  },
      { img:"fav9",  caption:"Tired but happy",               date:"",  },
      { img:"fav8",  caption:"Your favorite smile",           date:"",  },
      { img:"fav11", caption:"Evidence that we are not normal", date:"",  },
      { img:"fav13", caption:" You, laughing at me",    date:"",  },
      { img:"4", caption:"Still my favorite person",      date:"",  },
      { img:"green", caption:"i love you",      date:"",  },
      { img:"elev", caption:"i love your outfits",      date:"",  },
      { img:"bab", caption:"you are my whole life",      date:"",  }
    ];

    const $ = id => document.getElementById(id);
    const EMOJIS = ["🌷","🥰","😂","💍","❤️","🍕"];
    document.getElementById("backLink").setAttribute("href", MAIN_PAGE);

    function loadImageFallback(img, ph, base){
      const exts = ["jpg","jpeg","png","webp","JPG","JPEG","PNG"];
      let i = 0;
      img.onload = ()=>{ img.style.display = "block"; ph.style.display = "none"; };
      img.onerror = ()=>{
        i++;
        if(i < exts.length){ img.src = `images/${base}.${exts[i]}`; }
        else { img.style.display = "none"; ph.style.display = "grid"; }
      };
      img.src = `images/${base}.${exts[0]}`;
    }

    // ---------- build the wall ----------
    const line = $("line");
    MEMORIES.forEach((m,i)=>{
      const clip = document.createElement("div");
      clip.className = "clip";
      clip.innerHTML = `
        <span class="pin" aria-hidden="true"></span>
        <button class="pol" aria-label="Open memory: ${m.caption.replace(/"/g,"&quot;")}">
          <div class="shot"><img alt="${m.caption.replace(/"/g,"&quot;")}" style="display:none"><div class="ph"></div></div>
          <div class="cap"></div>
        </button>`;
      clip.querySelector(".cap").textContent = m.caption;
      const ph = clip.querySelector(".ph");
      ph.innerHTML = `${EMOJIS[i % EMOJIS.length]}<br>Add images/${m.img}.jpg`;
      loadImageFallback(clip.querySelector("img"), ph, m.img);
      clip.querySelector(".pol").addEventListener("click", ()=>openLb(i));
      line.appendChild(clip);
    });

    // photos "develop" as they scroll into view
    const io = "IntersectionObserver" in window
      ? new IntersectionObserver(entries=>{
          entries.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add("in"); io.unobserve(en.target); } });
        }, {threshold:.35})
      : null;
    document.querySelectorAll(".clip").forEach(c=>{ io ? io.observe(c) : c.classList.add("in"); });

    // ---------- lightbox ----------
    let cur = 0, lastJar = -1;
    function openLb(i){
      cur = (i + MEMORIES.length) % MEMORIES.length;
      const m = MEMORIES[cur];
      $("lb").classList.remove("hidden");
      document.body.style.overflow = "hidden";
      $("lbImg").alt = m.caption;
      $("lbPh").innerHTML = `${EMOJIS[cur % EMOJIS.length]}<br>Add images/${m.img}.jpg`;
      loadImageFallback($("lbImg"), $("lbPh"), m.img);
      $("lbCap").textContent = m.caption;
      $("lbDate").textContent = m.date || "";
      $("lbStory").textContent = m.story;
      $("lbCount").textContent = `${cur+1} / ${MEMORIES.length}`;
    }
    function closeLb(){ $("lb").classList.add("hidden"); document.body.style.overflow = ""; }

    $("lbClose").addEventListener("click", closeLb);
    $("lb").addEventListener("click", e=>{ if(e.target === $("lb")) closeLb(); });
    $("lbPrev").addEventListener("click", ()=>openLb(cur-1));
    $("lbNext").addEventListener("click", ()=>openLb(cur+1));
    document.addEventListener("keydown", e=>{
      if($("lb").classList.contains("hidden")) return;
      if(e.key === "Escape") closeLb();
      if(e.key === "ArrowLeft") openLb(cur-1);
      if(e.key === "ArrowRight") openLb(cur+1);
    });
    // swipe on phones
    let tx = null;
    $("lb").addEventListener("touchstart", e=>{ tx = e.touches[0].clientX; }, {passive:true});
    $("lb").addEventListener("touchend", e=>{
      if(tx === null) return;
      const dx = e.changedTouches[0].clientX - tx;
      if(Math.abs(dx) > 60) openLb(cur + (dx < 0 ? 1 : -1));
      tx = null;
    });

    // ---------- memory jar ----------
    $("jarBtn").addEventListener("click", ()=>{
      let n;
      do{ n = Math.floor(Math.random() * MEMORIES.length); }while(MEMORIES.length > 1 && n === lastJar);
      lastJar = n;
      openLb(n);
    });
  </script>
</body>
</html>
